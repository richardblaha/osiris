<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="OSIRIS">
  <title>OSIRIS</title>
  <defs>
    <linearGradient id="osiris-cyan" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00f2fe"/><stop offset="1" stop-color="#00b4d8"/></linearGradient>
    <linearGradient id="osiris-rose" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff2a85"/><stop offset="1" stop-color="#c81d67"/></linearGradient>
  </defs>
  <polygon points="100,30 20,130 100,170" fill="url(#osiris-cyan)"/>
  <polygon points="100,30 180,130 100,170" fill="url(#osiris-rose)"/>
  <polygon points="20,130 100,170 180,130 100,110" fill="#000" opacity="0.35"/>
</svg>
