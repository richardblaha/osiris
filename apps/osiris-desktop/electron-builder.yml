appId: io.osiris.ide
productName: Osiris IDE
copyright: Copyright © 2026 Osiris IDE contributors

directories:
  output: dist_electron
  buildResources: build

# The upstream VSCodium build produces the app tree; electron-builder only packs it.
files:
  - "!**/*"
extraMetadata:
  name: osiris

asar: true

linux:
  category: Development
  synopsis: Custom VS Code distribution with AI, DEXPI and STEP tooling
  desktop:
    StartupWMClass: Osiris
  target:
    - AppImage
    - deb
    - rpm
  icon: build/icons

deb:
  depends:
    - libgtk-3-0
    - libnss3
    - libsecret-1-0

mac:
  category: public.app-category.developer-tools
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - dmg
    - zip

win:
  target:
    - nsis
  icon: build/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: Osiris IDE
