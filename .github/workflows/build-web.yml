name: Build Web

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  packages: write

jobs:
  server-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbfile-dev libsecret-1-dev libkrb5-dev

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @osiris/branding build
      - run: pnpm --filter @osiris/branding render:icons
      - run: pnpm --filter @osiris/web run prepare:shell
      - run: pnpm --filter @osiris/web build:shell

      - name: Smoke test the CLI wrapper
        run: node apps/osiris-web/server/index.mjs --help

      - uses: actions/upload-artifact@v4
        with:
          name: osiris-web-server
          path: apps/osiris-web/.build/vscode-reh-web-*
          if-no-files-found: error

  docker:
    runs-on: ubuntu-latest
    needs: server-bundle
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/osiris-web/Dockerfile
          push: false
          tags: osiris-web:ci
