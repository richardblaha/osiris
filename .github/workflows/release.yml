name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  extensions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter "./extensions/*" package
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: extensions/*/*.vsix

  release:
    runs-on: ubuntu-latest
    needs: [extensions]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            artifacts/**/*.vsix
          body: |
            Osiris IDE ${{ github.ref_name }}

            Desktop installers and the web server bundle are attached by the
            `Build Desktop` / `Build Web` workflows triggered by this same tag.
