name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  extensions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter "./extensions/*" package
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: extensions/*/*.vsix

  web:
    uses: ./.github/workflows/build-web.yml

  desktop:
    uses: ./.github/workflows/build-desktop.yml

  release:
    runs-on: ubuntu-latest
    needs: [extensions, web, desktop]
    # Desktop is best-effort: ship whatever platforms rebranded cleanly, but
    # never block the release on a desktop leg.
    if: ${{ !cancelled() && needs.extensions.result == 'success' && needs.web.result == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: "{vsix,osiris-web-server,osiris-desktop-*}"

      - name: Collect release assets
        run: |
          set -euo pipefail
          mkdir -p dist

          # First-party extensions
          find artifacts -name '*.vsix' -exec cp -v {} dist/ \;

          # Web server bundle (already a tarball from build-web.yml)
          find artifacts -name 'osiris-web-server.tar.gz' \
            -exec cp -v {} dist/osiris-web-server-linux-x64.tar.gz \;

          # Desktop portable archives (best-effort; may be absent)
          find artifacts -type f -name 'Osiris-*' \
            \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp -v {} dist/ \;

          echo "---- release assets ----"
          ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
          body: |
            Osiris IDE ${{ github.ref_name }}

            See `CHANGELOG.md` for the full change list.

            **Assets**
            - `*.vsix` — first-party extensions (osiris-ai, dexpi, step, workspace)
            - `osiris-web-server-*.tar.gz` — browser-served web server bundle
            - `Osiris-<os>-<arch>-*.{tar.gz,zip}` — desktop app (rebranded VSCodium
              prebuilt; portable, unsigned). Linux: extract and run `bin/osiris`.
