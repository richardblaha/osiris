name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  extensions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter "./extensions/*" package
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: extensions/*/*.vsix

  # NOTE: the desktop installers are not wired into the release yet — the
  # apps/osiris-desktop shell build is being reworked onto VSCodium's own
  # pipeline. Run `Build Desktop` manually (workflow_dispatch) meanwhile.

  web:
    uses: ./.github/workflows/build-web.yml

  release:
    runs-on: ubuntu-latest
    needs: [extensions, web]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release assets
        run: |
          set -euo pipefail
          mkdir -p dist

          # First-party extensions
          find artifacts -name '*.vsix' -exec cp -v {} dist/ \;

          # Web server bundle (already a tarball from build-web.yml)
          find artifacts -name 'osiris-web-server.tar.gz' \
            -exec cp -v {} dist/osiris-web-server-linux-x64.tar.gz \;

          echo "---- release assets ----"
          ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
          body: |
            Osiris IDE ${{ github.ref_name }}

            See `CHANGELOG.md` for the full change list.

            **Assets**
            - `*.vsix` — first-party extensions (osiris-ai, dexpi, step, workspace)
            - `osiris-web-server-*.tar.gz` — browser-served web server bundle

            Desktop installers are not part of this release yet — the desktop
            shell build is being reworked onto the VSCodium pipeline.
