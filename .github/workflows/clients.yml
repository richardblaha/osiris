name: Clients

# The installable clients: osiris-desktop (Tauri) for Linux, macOS and Windows, and the VS Code extension (.vsix).
on:
  push:
    branches: [main]
    paths: ["apps/osiris-desktop/**", "apps/osiris-vscode/**", "apps/osiris-pwa/src/theme.css", "packages/**", ".github/workflows/clients.yml"]
  workflow_dispatch:

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @osiris/desktop build
      - uses: actions/upload-artifact@v4
        with:
          name: osiris-desktop-${{ runner.os }}
          path: |
            apps/osiris-desktop/src-tauri/target/release/bundle/**/*.deb
            apps/osiris-desktop/src-tauri/target/release/bundle/**/*.AppImage
            apps/osiris-desktop/src-tauri/target/release/bundle/**/*.dmg
            apps/osiris-desktop/src-tauri/target/release/bundle/**/*.msi
            apps/osiris-desktop/src-tauri/target/release/bundle/**/*.exe

  vscode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter osiris-vscode package
      - uses: actions/upload-artifact@v4
        with:
          name: osiris-vscode
          path: apps/osiris-vscode/osiris-vscode.vsix
