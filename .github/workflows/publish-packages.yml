name: Publish Packages

on:
  push:
    tags: ["packages-v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package:
          - shared-core
          - protocol
          - agent-core
          - mcp
          - dot-osiris
          - telemetry
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@richardblaha"

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec turbo run build --filter="@richardblaha/${{ matrix.package }}..."

      - name: Publish @richardblaha/${{ matrix.package }}
        working-directory: packages/${{ matrix.package }}
        # pnpm publish (not npm publish) rewrites workspace:* deps (e.g.
        # agent-core -> shared-core) to a real resolved version.
        run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
