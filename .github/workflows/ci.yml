name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  # The collector's twin_events processor (Go): its tests, with the committed go.sum only.
  collector:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/observability/twin-events
    env:
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: deploy/observability/twin-events/go.mod
          cache-dependency-path: deploy/observability/twin-events/go.sum
      - run: go vet .
      - run: go test ./...

  # The desktop app (Tauri, Rust) otherwise compiles only when a release is tagged.
  desktop:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: node apps/osiris-desktop/scripts/theme.mjs
      - run: cargo check --locked
        working-directory: apps/osiris-desktop/src-tauri

  image:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [gateway, auth, control, runtime, local, operator, vitepress, web-events, digital-twin, digital-twin-alerts, tts]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.service }}
          tags: |
            type=raw,value=main
            type=sha,format=long
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # The observability collector image: contrib plus this repo's twin/events processor
  # (deploy/observability/twin-events/Dockerfile; deploy/observability/collector.yaml pulls it).
  image-otel-collector:
    if: github.event_name == 'push'
    needs: [test, collector]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}-otel-collector
          tags: |
            type=raw,value=main
            type=sha,format=long
      - uses: docker/build-push-action@v6
        with:
          context: deploy/observability/twin-events
          file: deploy/observability/twin-events/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=otel-collector
          cache-to: type=gha,mode=max,scope=otel-collector
