name: Build Desktop

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  rebrand:
    name: ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux-x64, darwin-x64, darwin-arm64, win32-x64]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @osiris/branding build
      - run: pnpm --filter @osiris/branding render:icons

      # linux-x64 additionally emits an AppImage (appimagetool, auto-downloaded)
      # and a snap (mksquashfs). Both are best-effort inside package.mjs.
      - name: Install Linux packaging tools
        if: matrix.platform == 'linux-x64'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends squashfs-tools

      - name: Fetch + rebrand VSCodium prebuilt
        working-directory: apps/osiris-desktop
        run: |
          node scripts/fetch-prebuilt.mjs ${{ matrix.platform }}
          node scripts/apply-branding.mjs
          node scripts/package.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: osiris-desktop-${{ matrix.platform }}
          # Osiris-<platform>-<release>.{tar.gz,zip} everywhere; linux-x64 also
          # .AppImage and .snap.
          path: apps/osiris-desktop/dist_electron/Osiris-*
          if-no-files-found: error
