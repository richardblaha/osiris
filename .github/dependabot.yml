version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: development
      types:
        patterns: ["@types/*"]
    ignore:
      # upstream shell tags are bumped deliberately, not by Dependabot
      - dependency-name: "electron*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: "/apps/osiris-web"
    schedule:
      interval: weekly
