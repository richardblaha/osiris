<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Osiris app icon: the cyan/magenta pyramid on the Osiris dark ground.
       Master logo lives in osiris.svg; this padded variant is the source for
       every rasterised app / installer / favicon target (see scripts/render-icons.mjs). -->
  <rect width="1024" height="1024" rx="228" fill="#121212"/>
  <g transform="translate(124.5 148.5) scale(3.875)">
    <polygon points="100,30 20,130 100,170" fill="#00FFFF" stroke="#00FFFF" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="100,30 180,130 100,170" fill="#FF00FF" stroke="#FF00FF" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="20,130 100,170 180,130 100,110" fill="#000000" opacity="0.38"/>
    <line x1="100" y1="30" x2="100" y2="170" stroke="#FFFFFF" stroke-width="3" opacity="0.6"/>
  </g>
</svg>
