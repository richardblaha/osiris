# kubectl apply -k deploy/observability
# Telemetry for the whole abydos cluster: OpenObserve stores and shows logs, metrics and traces; the OpenTelemetry
# Collector takes OTLP from applications (Osiris services and runtimes) and collects pod logs, node/pod metrics and
# Kubernetes events. Secret openobserve-root (not in git) is created from .env; see deploy/README.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability
resources:
  - namespace.yaml
  - openobserve.yaml
  - collector.yaml
  - agent.yaml
