# On every node: container logs from /var/log/pods and node/pod/container metrics from the kubelet, to OpenObserve.
# Osiris sends its own logs over OTLP (tied to traces), so its namespaces are left out here, as is this one.
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-agent
data:
  config.yaml: |
    receivers:
      filelog:
        include: [/var/log/pods/*/*/*.log]
        exclude:
          - /var/log/pods/observability_*/*/*.log
          - /var/log/pods/osiris_*/*/*.log
          - /var/log/pods/osiris-t-*_*/*/*.log
        start_at: end
        include_file_path: true
        operators:
          - { type: container, id: container-parser }
      kubeletstats:
        collection_interval: 60s
        auth_type: serviceAccount
        endpoint: https://${env:K8S_NODE_IP}:10250
        insecure_skip_verify: true
        metric_groups: [node, pod, container, volume]
    processors:
      memory_limiter: { check_interval: 1s, limit_percentage: 80, spike_limit_percentage: 20 }
      k8sattributes:
        filter:
          node_from_env_var: K8S_NODE_NAME
        extract:
          metadata: [k8s.namespace.name, k8s.pod.name, k8s.node.name, k8s.deployment.name, k8s.statefulset.name]
        pod_association:
          - sources: [{ from: resource_attribute, name: k8s.pod.uid }]
          - sources: [{ from: resource_attribute, name: k8s.pod.name }, { from: resource_attribute, name: k8s.namespace.name }]
      batch: {}
    exporters:
      otlphttp/openobserve:
        endpoint: http://openobserve.observability.svc.cluster.local:5080/api/default
        headers:
          Authorization: Basic ${env:O2_AUTH}
          stream-name: default
    service:
      telemetry:
        logs: { level: warn }
      pipelines:
        logs: { receivers: [filelog], processors: [memory_limiter, k8sattributes, batch], exporters: [otlphttp/openobserve] }
        metrics: { receivers: [kubeletstats], processors: [memory_limiter, k8sattributes, batch], exporters: [otlphttp/openobserve] }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: otel-agent
spec:
  selector:
    matchLabels: { app: otel-agent }
  template:
    metadata:
      labels: { app: otel-agent }
      annotations:
        config/version: "1"
    spec:
      serviceAccountName: otel-collector
      tolerations:
        - operator: Exists
      containers:
        - name: agent
          image: otel/opentelemetry-collector-contrib:0.161.0
          args: [--config=/conf/config.yaml]
          env:
            - name: K8S_NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            - name: K8S_NODE_IP
              valueFrom: { fieldRef: { fieldPath: status.hostIP } }
            - name: O2_AUTH
              valueFrom: { secretKeyRef: { name: openobserve-root, key: O2_AUTH } }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 384Mi }
          securityContext:
            # Pod log files are readable by root only.
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL], add: [DAC_READ_SEARCH] }
          volumeMounts:
            - { name: config, mountPath: /conf }
            - { name: pods, mountPath: /var/log/pods, readOnly: true }
      volumes:
        - name: config
          configMap: { name: otel-agent }
        - name: pods
          hostPath: { path: /var/log/pods }
