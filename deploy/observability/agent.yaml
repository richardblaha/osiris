# On every node: container logs from /var/log/pods, the node's own logs (Alpine with OpenRC, no systemd journal:
# /var/log/k3s.log is the k3s agent with the kubelet and containerd, /var/log/messages the syslog with the kernel) and
# node/pod/container metrics from the kubelet, over OTLP to the cluster collector (which writes them to ClickHouse). Osiris sends its own logs over OTLP (tied to traces), so its
# namespaces are left out here, as is this one.
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-agent
data:
  config.yaml: |
    receivers:
      filelog:
        include: [/var/log/pods/*/*/*.log]
        exclude:
          - /var/log/pods/observability_*/*/*.log
          - /var/log/pods/osiris_*/*/*.log
          - /var/log/pods/osiris-p-*_*/*/*.log
        start_at: end
        include_file_path: true
        operators:
          - { type: container, id: container-parser }
      # k3s: klog lines (I1021 06:30:58.513886 2975 server.go:177] …) and logrus ones (time="…" level=info msg="…").
      filelog/k3s:
        include: [/var/log/k3s.log]
        start_at: end
        resource: { service.name: k3s }
        operators:
          - type: router
            routes:
              - output: klog
                expr: 'body matches "^[IWEF]\\d{4} "'
              - output: logrus
                expr: 'body matches "^time="'
            default: end
          - id: klog
            type: regex_parser
            regex: '^(?P<sev>[IWEF])\d{4} [\d:.]+\s+\d+ (?P<source>[^\]]+)\] (?P<msg>.*)$'
            severity: { parse_from: attributes.sev, mapping: { info: I, warn: W, error: E, fatal: F } }
            output: end
          - id: logrus
            type: regex_parser
            regex: 'level=(?P<sev>\w+)'
            severity: { parse_from: attributes.sev }
            output: end
          - id: end
            type: noop
      # syslog: "Oct 21 06:03:15 <host> user.notice k3s-cert-monitor: message".
      filelog/syslog:
        include: [/var/log/messages, /var/log/node-problem-detector.log]
        start_at: end
        resource: { service.name: syslog }
        operators:
          - type: regex_parser
            regex: '^\w{3} +\d+ [\d:]+ \S+ (?P<facility>\w+)\.(?P<sev>\w+) (?P<program>[^:\[]+)(?:\[\d+\])?: '
            on_error: send_quiet
            severity:
              parse_from: attributes.sev
              mapping: { debug: debug, info: [info, notice], warn: warn, error: err, fatal: [crit, alert, emerg] }
      kubeletstats:
        collection_interval: 60s
        auth_type: serviceAccount
        endpoint: https://${env:K8S_NODE_IP}:10250
        insecure_skip_verify: true
        metric_groups: [node, pod, container, volume]
        # Volume metrics name their claim (k8s.volume.type, k8s.persistentvolumeclaim.name): the digital twin's fill
        # of each PVC. The API lookup finds a claim's volume (the ClusterRole may get pvcs and pvs).
        extra_metadata_labels: [k8s.volume.type]
        k8s_api_config: { auth_type: serviceAccount }
    processors:
      memory_limiter: { check_interval: 1s, limit_percentage: 80, spike_limit_percentage: 20 }
      # The node's own logs: which node.
      resource/node:
        attributes:
          - { key: k8s.node.name, value: "${env:K8S_NODE_NAME}", action: upsert }
          - { key: host.name, value: "${env:K8S_NODE_NAME}", action: upsert }
      k8sattributes:
        filter:
          node_from_env_var: K8S_NODE_NAME
        extract:
          metadata: [k8s.namespace.name, k8s.pod.name, k8s.node.name, k8s.deployment.name, k8s.statefulset.name, k8s.daemonset.name]
        pod_association:
          - sources: [{ from: resource_attribute, name: k8s.pod.uid }]
          - sources: [{ from: resource_attribute, name: k8s.pod.name }, { from: resource_attribute, name: k8s.namespace.name }]
      # Pod logs have no service.name: the deployment's, statefulset's or daemonset's name, else the container's.
      transform/service:
        log_statements:
          - context: resource
            statements:
              - set(attributes["service.name"], attributes["k8s.deployment.name"]) where attributes["service.name"] == nil and attributes["k8s.deployment.name"] != nil
              - set(attributes["service.name"], attributes["k8s.statefulset.name"]) where attributes["service.name"] == nil and attributes["k8s.statefulset.name"] != nil
              - set(attributes["service.name"], attributes["k8s.daemonset.name"]) where attributes["service.name"] == nil and attributes["k8s.daemonset.name"] != nil
              - set(attributes["service.name"], attributes["k8s.container.name"]) where attributes["service.name"] == nil
      batch: {}
    exporters:
      otlp/collector:
        endpoint: otel-collector.observability.svc.cluster.local:4319
        tls: { insecure: true }
        sending_queue: { queue_size: 2000 }
        retry_on_failure: { enabled: true }
    service:
      telemetry:
        logs: { level: warn }
      pipelines:
        logs: { receivers: [filelog], processors: [memory_limiter, k8sattributes, transform/service, batch], exporters: [otlp/collector] }
        logs/node: { receivers: [filelog/k3s, filelog/syslog], processors: [memory_limiter, resource/node, batch], exporters: [otlp/collector] }
        metrics: { receivers: [kubeletstats], processors: [memory_limiter, k8sattributes, batch], exporters: [otlp/collector] }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: otel-agent
spec:
  selector:
    matchLabels: { app: otel-agent }
  template:
    metadata:
      labels: { app: otel-agent }
      annotations:
        config/version: "5"
    spec:
      serviceAccountName: otel-collector
      tolerations:
        - operator: Exists
      containers:
        - name: agent
          image: otel/opentelemetry-collector-contrib:0.161.0
          args: [--config=/conf/config.yaml]
          env:
            - name: K8S_NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            - name: K8S_NODE_IP
              valueFrom: { fieldRef: { fieldPath: status.hostIP } }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 384Mi }
          securityContext:
            # Pod log files are readable by root only.
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL], add: [DAC_READ_SEARCH] }
          volumeMounts:
            - { name: config, mountPath: /conf }
            - { name: logs, mountPath: /var/log, readOnly: true }
      volumes:
        - name: config
          configMap: { name: otel-agent }
        - name: logs
          hostPath: { path: /var/log }
