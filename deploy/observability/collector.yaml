# The cluster's OpenTelemetry Collector: OTLP from applications (gRPC 4317, HTTP 4318) and from the node agents,
# cluster metrics (k8s_cluster) and Kubernetes events, enriched with pod metadata and written to ClickHouse.
# The twin_events processor (this repo's image, deploy/observability/twin-events) additionally appends every
# warn/error log record to the Redis stream osiris:otel:events, where the digital twin's API and Osiris's agent
# read it (GET /api/instances/:instance/events; the twin's alerting service turns them into alerts Osiris investigates).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-collector
rules:
  - apiGroups: [""]
    resources: [pods, nodes, nodes/stats, nodes/proxy, namespaces, services, endpoints, events, resourcequotas, replicationcontrollers, persistentvolumeclaims, persistentvolumes]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets, daemonsets, statefulsets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-collector
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: otel-collector }
subjects:
  - { kind: ServiceAccount, name: otel-collector, namespace: observability }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc: { endpoint: 0.0.0.0:4317 }
          http: { endpoint: 0.0.0.0:4318 }
      # The node agents: already enriched with their pods' metadata, so it isn't looked up again here.
      otlp/agents:
        protocols:
          grpc: { endpoint: 0.0.0.0:4319 }
      # Web analytics from the web-events service only (NetworkPolicy below): pageviews and events as log records,
      # kept apart from the cluster's telemetry.
      otlp/web:
        protocols:
          http: { endpoint: 0.0.0.0:4320 }
      k8s_cluster:
        collection_interval: 60s
      # Prometheus metrics of pods that ask for it (annotation prometheus.io/scrape: "true"; port and path from
      # prometheus.io/port and prometheus.io/path): Traefik, Cilium and the like.
      prometheus:
        config:
          scrape_configs:
            - job_name: kubernetes-pods
              scrape_interval: 60s
              kubernetes_sd_configs: [{ role: pod }]
              relabel_configs:
                - { source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape], action: keep, regex: "true" }
                - { source_labels: [__meta_kubernetes_pod_phase], action: drop, regex: "Pending|Succeeded|Failed" }
                - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
                  action: replace
                  regex: '([^:]+)(?::\d+)?;(\d+)'
                  replacement: '$$1:$$2'
                  target_label: __address__
                - { source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path], action: replace, regex: (.+), target_label: __metrics_path__ }
                - { source_labels: [__meta_kubernetes_namespace], target_label: k8s_namespace_name }
                - { source_labels: [__meta_kubernetes_pod_name], target_label: k8s_pod_name }
                - { source_labels: [__meta_kubernetes_pod_node_name], target_label: k8s_node_name }
      k8s_objects:
        objects:
          - { name: events, mode: watch, group: events.k8s.io }
    processors:
      memory_limiter: { check_interval: 1s, limit_percentage: 80, spike_limit_percentage: 20 }
      # Which cluster every record belongs to (resource attribute k8s.cluster.name): the twin filters by it, so
      # several clusters can share one ClickHouse without their telemetry mixing. Keep it in step with the twin's
      # CLICKHOUSE_CLUSTER (deploy/k8s/digital-twin.yaml).
      resource/cluster:
        attributes:
          - { key: k8s.cluster.name, value: busiris, action: upsert }
      k8s_attributes:
        extract:
          metadata: [k8s.namespace.name, k8s.pod.name, k8s.node.name, k8s.deployment.name, k8s.statefulset.name, k8s.container.name]
        pod_association:
          - sources: [{ from: resource_attribute, name: k8s.pod.ip }]
          - sources: [{ from: connection }]
      # ClickHouse wants few, large inserts.
      batch: { send_batch_size: 5000, timeout: 10s }
      batch/web: { send_batch_size: 1000, timeout: 5s }
      # Warn/error log records (min_severity, else inferred from the body like the twin's SEVERITY_EXPR) to the
      # Redis stream the digital twin and Osiris's agent read; best effort — a Redis failure never blocks the
      # pipeline to ClickHouse. REDIS_URL and the stream's prefix must match the twin's (REDIS_KEY_PREFIX).
      twin_events:
        redis_url: ${env:REDIS_URL}
        stream: ${env:REDIS_KEY_PREFIX}:otel:events
        min_severity: warn
        infer_from_body: true
        max_len: 10000
        max_message: 2000
        attributes:
          service.name: service
          k8s.cluster.name: cluster
          k8s.namespace.name: namespace
          k8s.pod.name: pod
          k8s.node.name: node
          k8s.container.name: container
        include_services: []
        exclude_services: []
    exporters:
      clickhouse:
        endpoint: tcp://clickhouse.observability.svc.cluster.local:9000?dial_timeout=10s
        database: otel
        username: otel
        password: ${env:CLICKHOUSE_PASSWORD}
        create_schema: true
        ttl: 720h
        timeout: 10s
        sending_queue: { queue_size: 2000 }
        retry_on_failure: { enabled: true, initial_interval: 5s, max_interval: 30s, max_elapsed_time: 300s }
      # Web events into their own database; web/schema.sql turns this raw table into web.web_events and aggregates.
      clickhouse/web:
        endpoint: tcp://clickhouse.observability.svc.cluster.local:9000?dial_timeout=10s
        database: web
        username: otel
        password: ${env:CLICKHOUSE_PASSWORD}
        create_schema: true
        logs_table_name: web_events_raw
        ttl: 168h
        timeout: 10s
        sending_queue: { queue_size: 2000 }
        retry_on_failure: { enabled: true, initial_interval: 5s, max_interval: 30s, max_elapsed_time: 300s }
    service:
      telemetry:
        logs: { level: warn }
      pipelines:
        traces: { receivers: [otlp], processors: [memory_limiter, resource/cluster, k8s_attributes, batch], exporters: [clickhouse] }
        metrics: { receivers: [otlp, k8s_cluster], processors: [memory_limiter, resource/cluster, k8s_attributes, batch], exporters: [clickhouse] }
        logs: { receivers: [otlp, k8s_objects], processors: [memory_limiter, resource/cluster, k8s_attributes, twin_events, batch], exporters: [clickhouse] }
        logs/agents: { receivers: [otlp/agents], processors: [memory_limiter, resource/cluster, twin_events, batch], exporters: [clickhouse] }
        metrics/agents: { receivers: [otlp/agents, prometheus], processors: [memory_limiter, resource/cluster, batch], exporters: [clickhouse] }
        logs/web: { receivers: [otlp/web], processors: [memory_limiter, batch/web], exporters: [clickhouse/web] }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels: { app: otel-collector }
  template:
    metadata:
      labels: { app: otel-collector }
      annotations:
        # Restart when the configuration changes.
        config/version: "5"
    spec:
      serviceAccountName: otel-collector
      imagePullSecrets: [{ name: ghcr-pull }]
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: collector
          # This repo's build: contrib plus the twin_events processor (deploy/observability/twin-events/Dockerfile).
          image: ghcr.io/richardblaha/osiris-otel-collector:main
          args: [--config=/conf/config.yaml]
          ports:
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: otlp-http, containerPort: 4318 }
            - { name: otlp-agents, containerPort: 4319 }
            - { name: otlp-web, containerPort: 4320 }
          env:
            - name: CLICKHOUSE_PASSWORD
              valueFrom: { secretKeyRef: { name: clickhouse-users, key: OTEL_PASSWORD } }
            - { name: REDIS_URL, value: redis://redis.observability.svc.cluster.local:6379/0 }
            - { name: REDIS_KEY_PREFIX, value: osiris }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: config, mountPath: /conf }
      volumes:
        - name: config
          configMap: { name: otel-collector }
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
spec:
  selector: { app: otel-collector }
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: otlp-grpc }
    - { name: otlp-http, port: 4318, targetPort: otlp-http }
    - { name: otlp-agents, port: 4319, targetPort: otlp-agents }
    - { name: otlp-web, port: 4320, targetPort: otlp-web }
---
# OTLP from anywhere in the cluster, except the web analytics receiver: only web-events writes there.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: otel-collector
spec:
  podSelector: { matchLabels: { app: otel-collector } }
  policyTypes: [Ingress, Egress]
  ingress:
    - ports: [{ port: 4317, protocol: TCP }, { port: 4318, protocol: TCP }, { port: 4319, protocol: TCP }]
    - from:
        - podSelector: { matchLabels: { app: web-events } }
      ports: [{ port: 4320, protocol: TCP }]
  # The twin_events processor's Redis, and ClickHouse for the rest; DNS and the Kubernetes API server (the
  # k8s_cluster/k8s_objects receivers and the prometheus scraper need it) must stay reachable.
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    # The API server: its endpoint (192.168.0.231:16443) and the `kubernetes` service's ClusterIP.
    - to:
        - ipBlock: { cidr: 192.168.0.231/32 }
      ports: [{ port: 16443, protocol: TCP }]
    - to:
        - ipBlock: { cidr: 10.152.183.1/32 }
      ports: [{ port: 443, protocol: TCP }]
    - to:
        - podSelector: { matchLabels: { app: redis } }
      ports: [{ port: 6379, protocol: TCP }]
    - to:
        - podSelector: { matchLabels: { app: clickhouse } }
      ports: [{ port: 9000, protocol: TCP }, { port: 8123, protocol: TCP }]
