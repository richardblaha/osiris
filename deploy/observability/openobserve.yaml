# OpenObserve (single node): logs, metrics and traces on its own volume, kept ZO_COMPACT_DATA_RETENTION_DAYS.
# Secret openobserve-root: ZO_ROOT_USER_EMAIL, ZO_ROOT_USER_PASSWORD, O2_AUTH (base64 of "email:password" for the collector).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: openobserve
spec:
  serviceName: openobserve
  replicas: 1
  selector:
    matchLabels: { app: openobserve }
  template:
    metadata:
      labels: { app: openobserve }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: openobserve
          image: public.ecr.aws/zinclabs/openobserve:v1.0.4
          ports:
            - { name: http, containerPort: 5080 }
          env:
            - { name: ZO_DATA_DIR, value: /data }
            - { name: ZO_COMPACT_DATA_RETENTION_DAYS, value: "30" }
            - { name: ZO_TELEMETRY, value: "false" }
            - { name: ZO_WEB_URL, value: https://observe.k6labs.cz }
            - name: ZO_ROOT_USER_EMAIL
              valueFrom: { secretKeyRef: { name: openobserve-root, key: ZO_ROOT_USER_EMAIL } }
            - name: ZO_ROOT_USER_PASSWORD
              valueFrom: { secretKeyRef: { name: openobserve-root, key: ZO_ROOT_USER_PASSWORD } }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { memory: 2Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /data }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: civo-volume
        resources: { requests: { storage: 20Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: openobserve
spec:
  selector: { app: openobserve }
  ports:
    - { name: http, port: 5080, targetPort: http }
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openobserve
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: observability-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: observe.k6labs.cz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: openobserve
                port:
                  name: http
  tls:
    - hosts: [observe.k6labs.cz]
      secretName: observe-k6labs-cz-tls
