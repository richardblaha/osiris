# Central database: rqlite (SQLite replicated with Raft), 3 nodes, so it survives losing one. Users and their
# permissions (control: all, nodes: join) and the automatic backup to S3 come from the
# rqlite-config secret (deploy/README.md).
apiVersion: v1
kind: Service
metadata:
  name: rqlite-internal
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: { app: rqlite }
  ports:
    - { name: http, port: 4001 }
    - { name: raft, port: 4002 }
---
apiVersion: v1
kind: Service
metadata:
  name: rqlite
spec:
  selector: { app: rqlite }
  ports:
    - { name: http, port: 4001, targetPort: 4001 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rqlite
spec:
  serviceName: rqlite-internal
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels: { app: rqlite }
  template:
    metadata:
      labels: { app: rqlite }
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector: { matchLabels: { app: rqlite } }
      containers:
        - name: rqlite
          image: rqlite/rqlite:10.3.4
          args:
            - -disco-mode=dns
            - -disco-config={"name":"rqlite-internal.osiris.svc.cluster.local"}
            - -bootstrap-expect=3
            - -join-interval=1s
            - -join-attempts=120
            - -join-as=node
            - -auth=/config/users.json
            - -auto-backup=/config/backup.json
            # The image's entrypoint adds node id, advertised addresses and the data dir (/rqlite/file/data).
          envFrom:
            - secretRef: { name: rqlite-config }
          ports:
            - { name: http, containerPort: 4001 }
            - { name: raft, containerPort: 4002 }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet: { path: "/readyz?noleader", port: http }
            initialDelaySeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: data, mountPath: /rqlite/file }
            - { name: config, mountPath: /config, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: config
          secret:
            secretName: rqlite-config
            items:
              - { key: users.json, path: users.json }
              - { key: backup.json, path: backup.json }
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: civo-volume
        resources: { requests: { storage: 2Gi } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: rqlite
spec:
  minAvailable: 2
  selector:
    matchLabels: { app: rqlite }
