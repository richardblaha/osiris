# The monolith's data (tenants/<slug>.db, files/<slug>/). Read once by legacy-import-job.yaml, then kept as a fallback.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: osiris-data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: civo-volume
  resources:
    requests:
      storage: 5Gi
