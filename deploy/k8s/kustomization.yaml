# kubectl apply -k deploy/k8s
# Secrets (not in git) are created from .env; see deploy/README.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: osiris
resources:
  - namespace.yaml
  - crd.yaml
  - rbac.yaml
  - networkpolicies.yaml
  - control.yaml
  - control-backup.yaml
  - gateway.yaml
  - operator.yaml
  - gotenberg.yaml
  - vitepress.yaml
  - digital-twin.yaml
  - tts.yaml
  - ingress.yaml
