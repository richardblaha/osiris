apiVersion: apps/v1
kind: Deployment
metadata:
  name: osiris
  labels:
    app: osiris
spec:
  # One replica: the volume is ReadWriteOnce and the run lock and tenant cache are in-process.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: osiris
  template:
    metadata:
      labels:
        app: osiris
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: osiris
          image: ghcr.io/richardblaha/osiris
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: OIDC_ISSUER
              value: https://auth.k6labs.cz
            - name: CORS_ORIGIN
              value: https://osiris.k6labs.cz
          # MISTRAL_API_KEY, OIDC_AUDIENCE (PocketID client ID)
          envFrom:
            - secretRef:
                name: osiris-env
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: osiris-data
