# Osiris speech: Piper TTS (Czech and English voices) for the web app and the digital twin, which reach it through
# the gateway's /api/tts and the twin's Osiris proxy. Stateless, unprivileged, reachable only from the gateway and
# the twin, and without egress (the voices are in the image).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tts
  labels: { app: tts }
spec:
  replicas: 1
  selector:
    matchLabels: { app: tts }
  template:
    metadata:
      labels: { app: tts }
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      imagePullSecrets: [{ name: ghcr-pull }]
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: tts
          image: ghcr.io/richardblaha/osiris-tts:main
          imagePullPolicy: Always
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: HOME, value: /tmp }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: tts
spec:
  selector: { app: tts }
  ports:
    - { name: http, port: 8080, targetPort: http }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tts
spec:
  podSelector: { matchLabels: { app: tts } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: { matchExpressions: [{ key: app, operator: In, values: [gateway] }] }
      ports: [{ port: 8080, protocol: TCP }]
  egress: []
