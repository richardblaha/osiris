# Runs tenants: reconciles Tenant objects into namespaces with the runtime, sleeps idle runtimes, site ingresses.
# One replica (Recreate), so two operators never act at once.
# Secret osiris-operator: INTERNAL_JWT_PRIVATE_KEY, INTERNAL_JWT_PUBLIC_KEY, SECRETS_MASTER_KEY,
# RUNTIME_SECRET_MISTRAL_API_KEY (passed to every runtime as MISTRAL_API_KEY).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: operator
  labels: { app: operator }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: operator }
  template:
    metadata:
      labels: { app: operator }
    spec:
      automountServiceAccountToken: true
      # Service env vars (SITES_PORT=tcp://…) would clash with our settings.
      enableServiceLinks: false
      serviceAccountName: operator
      imagePullSecrets: [{ name: ghcr-pull }]
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: operator
          image: ghcr.io/richardblaha/osiris-operator:main
          imagePullPolicy: Always
          ports:
            - { name: http, containerPort: 8081 }
          env:
            - { name: NAMESPACE, value: osiris }
            - { name: RUNTIME_IMAGE, value: ghcr.io/richardblaha/osiris-runtime:main }
            - { name: IMAGE_PULL_SECRET, value: ghcr-pull }
            - { name: CONTROL_URL, value: http://control.osiris.svc.cluster.local:3002 }
            - { name: GOTENBERG_URL, value: http://gotenberg.osiris.svc.cluster.local:3000 }
            - { name: VITEPRESS_URL, value: http://vitepress.osiris.svc.cluster.local:3000 }
            - { name: CLUSTER_ISSUER, value: letsencrypt }
            - { name: SITES_MIDDLEWARE, value: osiris-redirect-https@kubernetescrd }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: http://otel-collector.observability.svc.cluster.local:4318 }
            - { name: OTEL_RESOURCE_ATTRIBUTES, value: deployment.environment.name=production }
            - { name: RUNTIME_ENV_TIMEZONE, value: Europe/Prague }
            # OAuth sign-ins to MCP servers return to <PUBLIC_URL>/mcp-callback.
            - { name: RUNTIME_ENV_PUBLIC_URL, value: https://osiris.k6labs.cz }
            # Runtimes send their telemetry to the cluster's collector too (the operator's network policy lets them).
            - { name: RUNTIME_ENV_OTEL_EXPORTER_OTLP_ENDPOINT, value: http://otel-collector.observability.svc.cluster.local:4318 }
            - { name: RUNTIME_ENV_OTEL_RESOURCE_ATTRIBUTES, value: deployment.environment.name=production }
            - { name: NODE_EXTRA_CA_CERTS, value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt }
          envFrom:
            - secretRef: { name: osiris-operator }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests: { cpu: 20m, memory: 96Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 1Gi }
