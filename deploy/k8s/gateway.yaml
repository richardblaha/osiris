# The only way in for osiris.k6labs.cz: API calls with access tokens (introspected by osiris-auth at auth.k6labs.cz)
# routed to control or the project's runtime, the web app.
# Secret osiris-gateway: INTERNAL_JWT_PRIVATE_KEY, GATEWAY_CLIENT_SECRET (the same as osiris-auth's).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels: { app: gateway }
spec:
  replicas: 2
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway }
    spec:
      automountServiceAccountToken: false
      # Service env vars (SITES_PORT=tcp://…) would clash with our settings.
      enableServiceLinks: false
      serviceAccountName: gateway
      imagePullSecrets: [{ name: ghcr-pull }]
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: gateway
          image: ghcr.io/richardblaha/osiris-gateway:main
          imagePullPolicy: Always
          ports:
            - { name: http, containerPort: 3001 }
          env:
            - { name: NODE_ENV, value: production }
            - { name: DEFAULT_LOCALE, value: cs }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: http://otel-collector.observability.svc.cluster.local:4318 }
            - { name: OTEL_RESOURCE_ATTRIBUTES, value: deployment.environment.name=production }
            # The web-events site the web app counts its visits to (cookieless, paths without ids; /_e on this host is
            # web-events' IngressRoute, deploy/observability/web-events.yaml); unset = no counting.
            - { name: WEB_EVENTS_SITE, value: osiris.k6labs.cz }
            - { name: CORS_ORIGIN, value: https://osiris.k6labs.cz }
            - { name: CONTROL_URL, value: http://control.osiris.svc.cluster.local:3002 }
            - { name: TTS_URL, value: http://tts.osiris.svc.cluster.local:8080 }
            - { name: AUTH_URL, value: https://auth.k6labs.cz }
          envFrom:
            - secretRef: { name: osiris-gateway }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  selector: { app: gateway }
  ports:
    - { name: http, port: 3001, targetPort: http }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gateway
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: gateway }
