# Osiris Digital Twin (twin.k6labs.cz): the cluster's digital twin — structure synced from the Kubernetes API
# (read-only ServiceAccount, see rbac.yaml) into its SQLite (DTDL models, twins, relationships; the volume below),
# history sent as OpenTelemetry events, telemetry and history read from ClickHouse (otel, read-only user osiris).
# Serves its PWA (server/digital-twin/web, three.js). Sign-in through osiris-auth: the PWA signs in as the public
# client `digital-twin`, the API introspects as `osiris-digital-twin` and answers the group `admin`.
# Secret osiris-digital-twin: AUTH_CLIENT_SECRET, CLICKHOUSE_PASSWORD (user osiris's; deploy/README.md).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: digital-twin-data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ceph-rbd
  resources:
    requests: { storage: 1Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: digital-twin
  labels: { app: digital-twin }
spec:
  # One replica, one writer of its SQLite; Recreate, so the old pod lets go of the volume first.
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: digital-twin }
  template:
    metadata:
      labels: { app: digital-twin }
    spec:
      # Service env vars (CLICKHOUSE_PORT=tcp://… and the like) would clash with our settings.
      enableServiceLinks: false
      serviceAccountName: digital-twin
      imagePullSecrets: [{ name: ghcr-pull }]
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: digital-twin
          image: ghcr.io/richardblaha/osiris-digital-twin:main
          imagePullPolicy: Always
          ports:
            - { name: http, containerPort: 3004 }
          env:
            - { name: NODE_ENV, value: production }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: http://otel-collector.observability.svc.cluster.local:4318 }
            - { name: OTEL_RESOURCE_ATTRIBUTES, value: deployment.environment.name=production }
            - { name: NODE_EXTRA_CA_CERTS, value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt }
            - { name: CLUSTER_NAME, value: busiris }
            # Ceph's managers (microceph on the nodes; the active one answers): pools and the OSDs (disks) in the twin.
            - { name: CEPH_MANAGERS, value: "http://192.168.0.231:9283/metrics,http://192.168.0.241:9283/metrics,http://192.168.0.242:9283/metrics" }
            - { name: STATIC_DIR, value: /app/server/digital-twin/web/dist }
            - { name: AUTH_URL, value: https://auth.k6labs.cz }
            - { name: AUTH_REQUIRED_GROUP, value: admin }
            - { name: DATA_DIR, value: /data }
            - { name: CLICKHOUSE_URL, value: http://clickhouse.observability.svc.cluster.local:8123 }
            # The busiris cluster's telemetry, as the collector's resource/cluster processor stamps it; keep the
            # two values in step (CLICKHOUSE_CLUSTER also appears in deploy/observability/collector.yaml).
            - { name: CLICKHOUSE_CLUSTER, value: busiris }
          envFrom:
            - secretRef: { name: osiris-digital-twin }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
          resources:
            requests: { cpu: 20m, memory: 192Mi }
            limits: { memory: 384Mi }
          volumeMounts:
            # Read-only root filesystem: tsx caches in /tmp.
            - { name: tmp, mountPath: /tmp }
            - { name: data, mountPath: /data }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 1Gi }
        - name: data
          persistentVolumeClaim: { claimName: digital-twin-data }
---
apiVersion: v1
kind: Service
metadata:
  name: digital-twin
spec:
  selector: { app: digital-twin }
  ports:
    - { name: http, port: 3004, targetPort: http }
---
# The internet comes in through Traefik: twin.k6labs.cz, the same pattern as osiris.k6labs.cz.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: digital-twin
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: osiris-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: twin.k6labs.cz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: digital-twin
                port: { name: http }
  tls:
    - hosts: [twin.k6labs.cz]
      secretName: twin-k6labs-cz-tls
---
# Traefik only; everything the twin reads (the Kubernetes API, Redis, ClickHouse, osiris-auth) is egress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: digital-twin
spec:
  podSelector: { matchLabels: { app: digital-twin } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ingress } }
          podSelector: { matchLabels: { app.kubernetes.io/name: traefik } }
      ports: [{ port: 3004, protocol: TCP }]
