# Osiris Digital Twin (twin.k6labs.cz): the cluster's digital twin — structure synced from the Kubernetes API
# (read-only ServiceAccount, see rbac.yaml): its definitions (DTDL models, instances, dashboards) in SQLite
# (the volume below), its current state and the view's telemetry in Redis (deploy/observability/redis.yaml),
# warn/error events from the collector's stream, history sent as OpenTelemetry events, telemetry pages and
# history read from ClickHouse (otel, read-only user osiris).
# Serves its PWA (server/digital-twin/web, three.js). Sign-in through osiris-auth: the PWA signs in as the public
# client `digital-twin`, the API introspects as `osiris-digital-twin` and answers the group `admin`.
# Secret osiris-digital-twin: AUTH_CLIENT_SECRET, CLICKHOUSE_PASSWORD (user osiris's; deploy/README.md).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: digital-twin-data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ceph-rbd
  resources:
    requests: { storage: 1Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: digital-twin
  labels: { app: digital-twin }
spec:
  # One replica, one writer of its SQLite; Recreate, so the old pod lets go of the volume first.
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: digital-twin }
  template:
    metadata:
      labels: { app: digital-twin }
    spec:
      # Service env vars (CLICKHOUSE_PORT=tcp://… and the like) would clash with our settings.
      enableServiceLinks: false
      serviceAccountName: digital-twin
      imagePullSecrets: [{ name: ghcr-pull }]
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: digital-twin
          image: ghcr.io/richardblaha/osiris-digital-twin:main
          imagePullPolicy: Always
          ports:
            - { name: http, containerPort: 3004 }
          env:
            - { name: NODE_ENV, value: production }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: http://otel-collector.observability.svc.cluster.local:4318 }
            - { name: OTEL_RESOURCE_ATTRIBUTES, value: deployment.environment.name=production }
            - { name: NODE_EXTRA_CA_CERTS, value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt }
            # The first twin, made once when there is none (later twins are an admin's, in the PWA): this cluster.
            - { name: CLUSTER_NAME, value: busiris }
            # Ceph's managers (microceph on the nodes; the active one answers): pools and the OSDs (disks) in the twin.
            - { name: CEPH_MANAGERS, value: "http://192.168.0.231:9283/metrics,http://192.168.0.241:9283/metrics,http://192.168.0.242:9283/metrics" }
            - { name: STATIC_DIR, value: /app/server/digital-twin/web/dist }
            - { name: AUTH_URL, value: https://auth.k6labs.cz }
            # Admins see and manage every twin; the group twin:<id> sees that twin.
            - { name: AUTH_ADMIN_GROUP, value: admin }
            - { name: DATA_DIR, value: /data }
            # The cache of the twins' current state, the view's telemetry and the answers; the collector's
            # twin/events processor writes the warn/error stream there (same prefix: REDIS_KEY_PREFIX).
            - { name: REDIS_URL, value: redis://redis.observability.svc.cluster.local:6379/0 }
            - { name: REDIS_KEY_PREFIX, value: osiris }
            - { name: CLICKHOUSE_URL, value: http://clickhouse.observability.svc.cluster.local:8123 }
            # The busiris cluster's telemetry, as the collector's resource/cluster processor stamps it; keep the
            # two values in step (CLICKHOUSE_CLUSTER also appears in deploy/observability/collector.yaml).
            - { name: CLICKHOUSE_CLUSTER, value: busiris }
            # The twin's chat: Osiris's gateway and the project of its agent.
            - { name: OSIRIS_URL, value: https://osiris.k6labs.cz }
            - { name: OSIRIS_PROJECT, value: twin }
            # kubectl (the osiris-ops account) and ceph (the ceph-ops secret) for that project's agent only.
            - { name: OPS_PROJECTS, value: twin }
            # The alerts service (digital-twin-alerts.yaml), asked with this pod's token projected for it.
            - { name: ALERTS_URL, value: http://digital-twin-alerts.osiris.svc.cluster.local:3006 }
            - { name: ALERTS_TOKEN_PATH, value: /var/run/secrets/twin-alerts/token }
          envFrom:
            - secretRef: { name: osiris-digital-twin }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
          resources:
            requests: { cpu: 20m, memory: 192Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            # Read-only root filesystem: tsx caches in /tmp.
            - { name: tmp, mountPath: /tmp }
            - { name: data, mountPath: /data }
            - { name: ops-token, mountPath: /var/run/secrets/osiris-ops, readOnly: true }
            - { name: ceph-ops, mountPath: /etc/ceph-ops, readOnly: true }
            - { name: alerts-token, mountPath: /var/run/secrets/twin-alerts, readOnly: true }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 1Gi }
        # The osiris-ops ServiceAccount's token (cluster-admin) for the agent's kubectl, only in this pod.
        - name: ops-token
          secret: { secretName: osiris-ops-token, items: [{ key: token, path: token }] }
        # Ceph's admin config and keyring for the agent's ceph (not in git; see deploy/README.md). Optional: without
        # it the agent has no ceph tool.
        - name: ceph-ops
          secret: { secretName: ceph-ops, optional: true, items: [{ key: ceph.conf, path: ceph.conf }, { key: keyring, path: keyring }] }
        - name: data
          persistentVolumeClaim: { claimName: digital-twin-data }
        # The ServiceAccount's token for the alerts service only (audience osiris-twin-alerts), rotated by the kubelet.
        - name: alerts-token
          projected:
            sources:
              - serviceAccountToken: { audience: osiris-twin-alerts, expirationSeconds: 3600, path: token }
---
apiVersion: v1
kind: Service
metadata:
  name: digital-twin
spec:
  selector: { app: digital-twin }
  ports:
    - { name: http, port: 3004, targetPort: http }
---
# The internet comes in through Traefik: twin.k6labs.cz, the same pattern as osiris.k6labs.cz.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: digital-twin
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: osiris-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: twin.k6labs.cz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: digital-twin
                port: { name: http }
  tls:
    - hosts: [twin.k6labs.cz]
      secretName: twin-k6labs-cz-tls
---
# Traefik, and project runtimes (their agents' kubectl and ceph, checked per project); everything the twin reads
# (the Kubernetes API, ClickHouse, Ceph's managers, osiris-auth, Osiris) is egress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: digital-twin
spec:
  podSelector: { matchLabels: { app: digital-twin } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ingress } }
          podSelector: { matchLabels: { app.kubernetes.io/name: traefik } }
        - namespaceSelector: { matchExpressions: [{ key: osiris.k6labs.cz/project, operator: Exists }] }
          podSelector: { matchLabels: { app: runtime } }
      ports: [{ port: 3004, protocol: TCP }]
