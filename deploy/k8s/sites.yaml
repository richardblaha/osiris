# Tenant websites on their custom domains: static files of the current release, from object storage.
# Secret osiris-sites: RQLITE_USERNAME/RQLITE_PASSWORD (read-only user), S3_*.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sites
  labels: { app: sites }
spec:
  replicas: 2
  selector:
    matchLabels: { app: sites }
  template:
    metadata:
      labels: { app: sites }
    spec:
      automountServiceAccountToken: false
      # Service env vars (SITES_PORT=tcp://…) would clash with our settings.
      enableServiceLinks: false
      serviceAccountName: sites
      imagePullSecrets: [{ name: ghcr-pull }]
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: sites
          image: ghcr.io/richardblaha/osiris-sites:main
          imagePullPolicy: Always
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: NODE_ENV, value: production }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: http://otel-collector.observability.svc.cluster.local:4318 }
            - { name: OTEL_RESOURCE_ATTRIBUTES, value: deployment.environment.name=production }
            - { name: RQLITE_URL, value: http://rqlite.osiris.svc.cluster.local:4001 }
          envFrom:
            - secretRef: { name: osiris-sites }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: sites
spec:
  selector: { app: sites }
  ports:
    - { name: http, port: 8080, targetPort: http }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sites
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: sites }
