# Projects and their members, schedules, WhatsApp and backups; users and groups are osiris-auth's (SCIM, deploy/auth).
# Writes Project objects only. Its SQLite (one writer: one replica, on a volume like osiris-auth's; VACUUM INTO
# backups daily, to the volume and the bucket, CronJob control-backup).
# Secret osiris-control: INTERNAL_JWT_PRIVATE_KEY, INTERNAL_JWT_PUBLIC_KEY, AUTH_SCIM_TOKEN, EMAILIT_API_KEY,
# S3_*, WHATSAPP_*, CLICKHOUSE_PASSWORD (the read-only user osiris; see deploy/README.md).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: control-data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ceph-rbd
  resources:
    requests: { storage: 2Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control
  labels: { app: control }
spec:
  # SQLite has one writer: never two pods on the volume.
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: control }
  template:
    metadata:
      labels: { app: control }
    spec:
      automountServiceAccountToken: true
      # Service env vars (SITES_PORT=tcp://…) would clash with our settings.
      enableServiceLinks: false
      serviceAccountName: control
      imagePullSecrets: [{ name: ghcr-pull }]
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: control
          image: ghcr.io/richardblaha/osiris-control:main
          imagePullPolicy: Always
          ports:
            - { name: http, containerPort: 3002 }
          env:
            - { name: NODE_ENV, value: production }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: http://otel-collector.observability.svc.cluster.local:4318 }
            - { name: OTEL_RESOURCE_ATTRIBUTES, value: deployment.environment.name=production }
            - { name: ORCHESTRATOR, value: kubernetes }
            - { name: K8S_NAMESPACE, value: osiris }
            - { name: LOCAL_DB_PATH, value: /data/control.db }
            - { name: PUBLIC_URL, value: https://osiris.k6labs.cz }
            - { name: AUTH_URL, value: https://auth.k6labs.cz }
            - { name: MAIL_FROM, value: "Osiris <auth@k6labs.cz>" }
            - { name: TIMEZONE, value: Europe/Prague }
            - { name: DEFAULT_LOCALE, value: cs }
            - { name: NODE_EXTRA_CA_CERTS, value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt }
            - { name: CLICKHOUSE_URL, value: http://clickhouse.observability.svc.cluster.local:8123 }
          envFrom:
            - secretRef: { name: osiris-control }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { memory: 768Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: data, mountPath: /data }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 1Gi }
        - name: data
          persistentVolumeClaim: { claimName: control-data }
---
apiVersion: v1
kind: Service
metadata:
  name: control
spec:
  selector: { app: control }
  ports:
    - { name: http, port: 3002, targetPort: http }
