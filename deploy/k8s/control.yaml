# Sign-in (the OpenID Connect provider at https://osiris.k6labs.cz/auth), users, projects, schedules, WhatsApp and backups.
# Writes Project objects only.
# Secret osiris-control: INTERNAL_JWT_PRIVATE_KEY, INTERNAL_JWT_PUBLIC_KEY, AUTH_SIGNING_KEY, AUTH_SECRET, EMAILIT_API_KEY,
# GOOGLE_*/FACEBOOK_*/MICROSOFT_*/SEZNAM_* (optional), RQLITE_USERNAME, RQLITE_PASSWORD, S3_*, WHATSAPP_*,
# CLICKHOUSE_PASSWORD (the read-only user osiris; see deploy/README.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control
  labels: { app: control }
spec:
  replicas: 2
  # Keep updates within cluster capacity while one replica remains available.
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 0, maxUnavailable: 1 }
  selector:
    matchLabels: { app: control }
  template:
    metadata:
      labels: { app: control }
    spec:
      automountServiceAccountToken: true
      # Service env vars (SITES_PORT=tcp://…) would clash with our settings.
      enableServiceLinks: false
      serviceAccountName: control
      imagePullSecrets: [{ name: ghcr-pull }]
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: control
          image: ghcr.io/richardblaha/osiris-control:main
          imagePullPolicy: Always
          ports:
            - { name: http, containerPort: 3002 }
          env:
            # Use bundled GeoIP data; automatic refresh temporarily exceeds the memory budget.
            - { name: GEOIP_AUTO_UPDATE, value: "false" }
            - { name: NODE_ENV, value: production }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: http://otel-collector.observability.svc.cluster.local:4318 }
            - { name: OTEL_RESOURCE_ATTRIBUTES, value: deployment.environment.name=production }
            - { name: ORCHESTRATOR, value: kubernetes }
            - { name: K8S_NAMESPACE, value: osiris }
            - { name: RQLITE_URL, value: http://rqlite.osiris.svc.cluster.local:4001 }
            - { name: PUBLIC_URL, value: https://osiris.k6labs.cz }
            - { name: MAIL_FROM, value: "Osiris <auth@k6labs.cz>" }
            - { name: TIMEZONE, value: Europe/Prague }
            - { name: DEFAULT_LOCALE, value: cs }
            - { name: NODE_EXTRA_CA_CERTS, value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt }
            - { name: CLICKHOUSE_URL, value: http://clickhouse.observability.svc.cluster.local:8123 }
          envFrom:
            - secretRef: { name: osiris-control }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { memory: 768Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: control
spec:
  selector: { app: control }
  ports:
    - { name: http, port: 3002, targetPort: http }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: control
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: control }
