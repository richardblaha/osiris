# Least privilege per service. Only the operator can touch project namespaces; control can only write Project
# objects (and ask the API server who a runtime token belongs to); the digital twin reads the cluster's structure;
# the gateway has no API access.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: control
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: operator
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gateway
automountServiceAccountToken: false
---
# The digital twin: the cluster's namespaces, pods, nodes and replicasets, read-only (the twin's structure).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: digital-twin
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: control
rules:
  - apiGroups: [osiris.k6labs.cz]
    resources: [projects]
    verbs: [get, list, watch, create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: control
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: control }
subjects: [{ kind: ServiceAccount, name: control, namespace: osiris }]
---
# TokenReview: control checks which project a runtime's projected token belongs to.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: osiris-control-token-review
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: system:auth-delegator }
subjects: [{ kind: ServiceAccount, name: control, namespace: osiris }]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: osiris-operator
rules:
  - apiGroups: [""]
    resources: [namespaces, serviceaccounts, secrets, configmaps, services, resourcequotas, limitranges]
    verbs: [get, list, watch, create, patch, update, delete]
  - apiGroups: [apps]
    resources: [statefulsets]
    verbs: [get, list, watch, create, patch, update, delete]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch, create, patch, update, delete]
  - apiGroups: [osiris.k6labs.cz]
    resources: [projects, projects/status]
    verbs: [get, list, watch, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: osiris-operator
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: osiris-operator }
subjects: [{ kind: ServiceAccount, name: operator, namespace: osiris }]
---
# What the digital twin builds its tree from: the cluster's structure, read-only.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: osiris-digital-twin
rules:
  - apiGroups: [""]
    resources: [namespaces, pods, nodes, persistentvolumeclaims, persistentvolumes, services]
    verbs: [get, list]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list]
  - apiGroups: [traefik.io]
    resources: [ingressroutes]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: osiris-digital-twin
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: osiris-digital-twin }
subjects: [{ kind: ServiceAccount, name: digital-twin, namespace: osiris }]
---
# The twin checks which project a runtime is (TokenReview) before its agent may run kubectl or ceph there.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: osiris-digital-twin-token-review
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: system:auth-delegator }
subjects: [{ kind: ServiceAccount, name: digital-twin, namespace: osiris }]
---
# The account the agent's kubectl runs as (in the twin's pod, for OPS_PROJECTS only), read-only: the built-in view
# role (namespaced resources, no Secrets) and the cluster's own objects below. The twin also refuses every command
# that isn't a read. Its token is a secret mounted only into the twin.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: osiris-ops
---
apiVersion: v1
kind: Secret
metadata:
  name: osiris-ops-token
  annotations: { kubernetes.io/service-account.name: osiris-ops }
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: osiris-ops
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: view }
subjects: [{ kind: ServiceAccount, name: osiris-ops, namespace: osiris }]
---
# What view leaves out and the agent reads: nodes, volumes, storage and scheduling, the API's own registrations, RBAC,
# the metrics behind `kubectl top`, and the custom resources of what runs here (never Secrets).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: osiris-ops-read
rules:
  - apiGroups: [""]
    resources: [nodes, persistentvolumes, namespaces, componentstatuses]
    verbs: [get, list, watch]
  - apiGroups:
      - storage.k8s.io
      - scheduling.k8s.io
      - node.k8s.io
      - networking.k8s.io
      - apiextensions.k8s.io
      - apiregistration.k8s.io
      - admissionregistration.k8s.io
      - rbac.authorization.k8s.io
      - certificates.k8s.io
      - coordination.k8s.io
      - discovery.k8s.io
      - metrics.k8s.io
      - snapshot.storage.k8s.io
      - osiris.k6labs.cz
      - traefik.io
      - cert-manager.io
      - acme.cert-manager.io
      - metallb.io
      - crd.projectcalico.org
      - ceph.rook.io
    resources: ["*"]
    verbs: [get, list, watch]
  - nonResourceURLs: [/api, /api/*, /apis, /apis/*, /version, /healthz, /livez, /readyz, /openapi/*]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: osiris-ops-read
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: osiris-ops-read }
subjects: [{ kind: ServiceAccount, name: osiris-ops, namespace: osiris }]
