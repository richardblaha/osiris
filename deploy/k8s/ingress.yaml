apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: osiris
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: osiris-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: osiris.k6labs.cz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: osiris
                port:
                  name: http
  tls:
    - hosts: [osiris.k6labs.cz]
      secretName: osiris-k6labs-cz-tls
